name: release
on:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: dtolnay/rust-toolchain@stable

      - name: Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build backend sidecar
        shell: bash
        run: |
          pip install -r backend/requirements.txt pyinstaller
          pyinstaller --onefile --name scales-backend backend/main.py
          TRIPLE=$(rustc -Vv | grep host | cut -f2 -d' ')
          EXT=""; [[ "$RUNNER_OS" == "Windows" ]] && EXT=".exe"
          mkdir -p src-tauri/binaries
          cp dist/scales-backend$EXT src-tauri/binaries/scales-backend-$TRIPLE$EXT

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Scales ${{ github.ref_name }}'
          releaseDraft: true